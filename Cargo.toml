[package]
name = "pocket-relay-data-export"
version = "0.0.1"
edition = "2021"
description = "ASI plugin for ME3 to export official data"
repository = "https://github.com/PocketRelay/PocketRelayHooks"
license = "MIT"
readme = "README.md"
authors = ["Jacobtread <jacobtread@gmail.com>"]
keywords = ["Hooking"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Shared backing library
pocket-relay-client-shared = { version = "2.0.0" }

log = "0.4.20"
log-panics = { version = "2", features = ["with-backtrace"] }

reqwest = { version = "0.13.5", default-features = false, features = [
  "charset",
  "json",
  "gzip",
  "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Blaze SSLv3 async TCPStream implementation
blaze-ssl-async = "^0.4"

tdf = "0.4"
bytes = "1.4.0"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "2"


bitflags = "2.4.0"
directories = "6.0.0"

futures = "0.3"
parking_lot = "0.13"
minhook = "0.9.0"

native-windows-gui = { version = "1", features = ["notice"] }

[dependencies.windows-sys]
version = "0.61"
features = [
  # Foundational types
  "Win32_Foundation",
  # For DLL_PROCESS_ATTACH and DLL_PROCESS_DETACH constants
  "Win32_System_SystemServices",
  # Requried for virtual protecting memory
  "Win32_System_Memory",
  # Required for allocating consoles
  "Win32_System_Console",
  # Required for HOSTENT structure and gethostbyname function
  "Win32_Networking_WinSock",
  # APIs to suspend threads
  "Win32_System_Diagnostics_ToolHelp",
  # Library loading
  "Win32_System_LibraryLoader",
]


# Logging provider
[dependencies.log4rs]
version = "1.2.0"
default-features = false
features = ["console_appender", "file_appender"]
